bricks:
  - id: B-decorators
    name: JIG Core Decorators
    layer: 0
    units:
      - M-jig.__init__

  - id: B-cli
    name: CLI Interface
    layer: 1
    units:
      - M-jig.cli.main
      - M-jig.cli.validate
      - M-jig.cli.discovery
      - M-jig.cli.rebuild
      - M-jig.cli.show
      - M-jig.cli.audit
      - M-jig.cli.auto_rebuild
      - M-jig.cli.output
      - M-jig.cli.init

  - id: B-validation
    name: Artifact Validation
    layer: 0
    units:
      - M-jig.validation.intent
      - M-jig.validation.bricks
      - M-jig.validation.models
      - M-jig.validation.reporting
      - M-jig.validation.engine

  - id: B-impl-graph
    name: Implementation Graph
    layer: 0
    units:
      - M-jig.impl_graph.graph
      - M-jig.impl_graph.builder
      - M-jig.impl_graph.ndjson_writer

  - id: B-intent-graph
    name: Intent Graph
    layer: 0
    units:
      - M-jig.intent_graph.generator

  - id: B-config
    name: Configuration
    layer: 0
    units:
      - M-jig.config.discovery
      - M-jig.config.parser
      - M-jig.config.schema

  - id: B-hashing
    name: Content Hashing
    layer: 0
    units:
      - M-jig.hashing

  - id: B-languages
    name: Language Analyzers
    layer: 0
    units:
      - M-jig.impl_graph.analyzers.base
      - M-jig.impl_graph.analyzers.registry
      - M-jig.impl_graph.analyzers.python
      - M-jig.impl_graph.analyzers.python_visitor

  - id: B-verification-graph
    name: Verification Graph
    layer: 1
    units:
      - M-jig.verification_graph.discovery
      - M-jig.verification_graph.analyzer
      - M-jig.verification_graph.builder

  - id: B-audit
    name: Audit System
    layer: 1
    units:
      - M-jig.audit.coverage
      - M-jig.audit.record_writer

  - id: B-staleness
    name: Staleness Detection
    layer: 0
    units:
      - M-jig.staleness

  - id: B-templates
    name: Template Content
    layer: 0
    units:
      - M-jig.templates.templates

  - id: B-init
    name: Project Initialization
    layer: 0
    units:
      - M-jig.init

  - id: B-rules
    name: Rules Engine
    layer: 0
    units:
      - M-jig.rules.base
      - M-jig.rules.context
      - M-jig.rules.registry
      - M-jig.rules.types.__init__
      - M-jig.rules.types.required_field
      - M-jig.rules.types.id_format
      - M-jig.rules.types.uniqueness
      - M-jig.rules.types.filename_sync
      - M-jig.rules.types.header_sync
      - M-jig.rules.types.excluded_field
      - M-jig.rules.types.field_type
      - M-jig.rules.types.field_value
      - M-jig.rules.types.reference_validity
      - M-jig.rules.types.bidirectional_link
      - M-jig.rules.types.coverage
      - M-jig.rules.types.partition
      - M-jig.rules.types.dag
      - M-jig.rules.types.layer_constraint
      - M-jig.rules.types.isolation

  - id: B-mend
    name: Mend Actions
    layer: 0
    units:
      - M-jig.mend.__init__
      - M-jig.mend.yaml_editor
      - M-jig.mend.actions
