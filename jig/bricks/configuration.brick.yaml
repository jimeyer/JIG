# Configuration & Filtering Brick
brick:
  id: BRICK-CONFIG
  name: "Configuration & Filtering"
  version: "1.0.0"
  layer: foundation

responsibility: |
  Load configuration from jig.toml and manage file ignore patterns.
  Provides default configuration, parses .jigignore patterns,
  and filters paths based on ignore rules.

interface:
  public:
    # config.py
    - class: JigConfig
      fields:
        - intent_dir: Path
        - annotation_dirs: list[Path]
        - index_file: Path
    - function: load_config(path: Path = Path("jig.toml")) -> JigConfig
    # ignore_filter.py
    - class: IgnoreFilter
      methods:
        - should_exclude(path: Path) -> bool
        - add_pattern(pattern: str) -> None

  stability: stable
  versioning: semver

dependencies:
  bricks: []
  external:
    - toml
    - fnmatch

code:
  paths:
    - src/jig/core/config.py
    - src/jig/core/ignore_filter.py
  loc: 219

tests:
  paths:
    - tests/unit/test_config.py
    - tests/unit/test_ignore_filter.py
  count: 18
  coverage: 90%

intent:
  outcomes: []
  specifications: []
  notes: |
    Foundation layer - would benefit from explicit S-CONFIG-* specifications
    for configuration format and filtering behavior.

metrics:
  coupling_ratio: "30:1"
  test_coverage: 90%
  cyclomatic_complexity: low

health:
  score: excellent
  status: stable
  last_review: 2025-11-22
  notes: Clear boundaries, simple responsibilities, minimal dependencies
