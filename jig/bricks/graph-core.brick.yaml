# Graph Core Brick
brick:
  id: BRICK-GRAPH
  name: "Graph Core"
  version: "1.0.0"
  layer: domain-core

responsibility: |
  Graph data structures and query operations.
  Defines Graph, Node, Edge, Subsystem classes.
  Loads graph from jig/ directory, queries graph
  (dependencies, dependents, paths), traverses graph structure,
  manages subsystem hierarchy, and extracts relationship edges.

interface:
  public:
    - class: Edge
      fields:
        - source: str
        - target: str
        - relation_type: str
    - class: Subsystem
      fields:
        - name: str
        - description: str
        - subsystems: dict[str, Subsystem]
        - nodes: list[str]
      methods:
        - full_path() -> str
        - is_leaf() -> bool
        - get_all_nodes() -> list[str]
        - find_subsystem(path: str) -> Subsystem | None
    - class: Graph
      fields:
        - nodes: dict[str, OSTCNode]
        - edges: list[Edge]
        - subsystems: dict[str, Subsystem]
      methods:
        - load_from_dir(intent_dir: Path) -> Graph
        - get_dependencies(node_id: str) -> list[str]
        - get_dependents(node_id: str) -> list[str]
        - find_path(start: str, end: str) -> list[str] | None
        - get_nodes_by_subsystem(subsystem: str) -> list[str]
        - find_orphaned_nodes() -> list[str]

  stability: stable
  versioning: semver

dependencies:
  bricks:
    - BRICK-PARSER
    - BRICK-UTILS
  external:
    - networkx
    - json

code:
  paths:
    - src/jig/core/graph.py
    - src/jig/core/relationships.py
  loc: 696

tests:
  paths:
    - tests/unit/test_graph.py
    - tests/unit/test_graph_queries.py
    - tests/unit/test_graph_traversal.py
    - tests/unit/test_relationship_parsing.py
  count: 48
  coverage: 75%

intent:
  outcomes:
    - O-JIG-003
  specifications:
    - S-GRAPH-001
    - S-GRAPH-002
    - S-GRAPH-003
  notes: |
    Maps to graph-related intent nodes.
    This is the largest Brick in the domain layer.
    Consider splitting into Graph Data and Graph Queries if complexity grows.

metrics:
  coupling_ratio: "12:1"
  test_coverage: 75%
  cyclomatic_complexity: medium-high

health:
  score: fair
  status: stable
  last_review: 2025-11-22
  notes: |
    Large Brick with substantial graph operations.
    Might benefit from splitting into:
    - Graph Data (structures + loading)
    - Graph Queries (traversal + search)
    Monitor complexity as system evolves.
