# Foundation Utilities Brick
brick:
  id: BRICK-UTILS
  name: "Foundation Utilities"
  version: "1.0.0"
  layer: foundation

responsibility: |
  Pure utility functions for file I/O and YAML operations.
  Provides read/write file operations with error handling,
  YAML load/dump with validation, and directory creation.
  No domain logic, pure utilities only.

interface:
  public:
    # io.py
    - function: read_file(path: Path) -> str
    - function: write_file(path: Path, content: str) -> None
    - function: ensure_dir(path: Path) -> None
    # yaml_utils.py
    - function: load_yaml(path: Path) -> dict[str, Any]
    - function: dump_yaml(data: dict[str, Any], path: Path) -> None

  stability: stable
  versioning: semver

dependencies:
  bricks: []
  external:
    - pathlib
    - yaml

code:
  paths:
    - src/jig/utils/io.py
    - src/jig/utils/yaml_utils.py
  loc: 173

tests:
  paths:
    - tests/unit/test_io.py
    - tests/unit/test_yaml_utils.py
  count: 24
  coverage: 95%

intent:
  outcomes: []
  specifications: []
  notes: |
    Foundation layer - would benefit from explicit O/S nodes
    for reliability and I/O correctness.

metrics:
  coupling_ratio: "∞:1"
  test_coverage: 95%
  cyclomatic_complexity: low

health:
  score: excellent
  status: stable
  last_review: 2025-11-22
  notes: Pure utilities, no internal dependencies, excellent test coverage
